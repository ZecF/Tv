<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas TV - Streaming Portal</title>
    <!-- Library Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: white; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        .sidebar { 
            width: 320px; 
            background: #1e1e1e; 
            overflow-y: auto; 
            border-right: 1px solid #333; 
            padding: 15px; 
            box-sizing: border-box; 
        }
        .sidebar::-webkit-scrollbar { 
            width: 8px; 
        }
        .sidebar::-webkit-scrollbar-thumb { 
            background: #444; 
            border-radius: 4px; 
        }
        .main { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
        }
        .video-container { 
            flex-grow: 1; 
            background: #000; 
            position: relative; 
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            outline: none; 
        }
        h2 { 
            text-align: center; 
            border-bottom: 2px solid #e50914; 
            padding-bottom: 10px; 
            margin-top: 0; 
            font-size: 22px; 
            color: #fff; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }
        .category-title { 
            margin: 20px 0 10px 0; 
            font-size: 13px; 
            color: #888; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 5px; 
        }
        .channel-card { 
            display: flex; 
            align-items: center; 
            padding: 10px; 
            background: #2a2a2a; 
            margin-bottom: 8px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
            border: 1px solid transparent; 
        }
        .channel-card:hover { 
            background: #333; 
            border-color: #e50914; 
            transform: translateX(5px); 
        }
        .channel-logo { 
            width: 55px; 
            height: 38px; 
            object-fit: contain; 
            background: #fff; 
            border-radius: 4px; 
            margin-right: 12px; 
            padding: 2px; 
        }
        .channel-info { 
            display: flex; 
            flex-direction: column; 
        }
        .channel-name { 
            font-weight: bold; 
            font-size: 14px; 
            color: #fff; 
        }
        #status { 
            padding: 15px; 
            background: #1a1a1a; 
            text-align: center; 
            font-weight: bold; 
            border-top: 1px solid #333; 
            color: #00ff88; 
            font-size: 15px; 
        }
        .error-text { 
            color: #ff3333 !important; 
        }
    </style>
</head>
<body>

    <!-- DAFTAR CHANNEL (SIDEBAR) -->
    <div class="sidebar">
        <h2>📺 DIMAS TV</h2>
        <div id="channel-list"></div>
    </div>

    <!-- PEMUTAR VIDEO (MAIN) -->
    <div class="main">
        <div class="video-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>
        <div id="status">Pilih channel di samping untuk mulai menonton...</div>
    </div>

    <script>
        // 1. DAFTAR SALURAN STREAM (Pilihan Stabil & Non-DRM dari Dataset)
        const STREAM_URLS = [
            // Kategori: TV Nasional Indonesia
            {

                "url": "https://video.detik.com/trans7/smil:trans7.smil/playlist.m3u8"
            },
            {
                "name": "TRANS TV",
                "category": "TV Indonesia",
                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1LAR1UUsYqpBTkO5W4bnL-bWT3V5bReOiIA&usqp=CAU",
                "url": "https://video.detik.com/transtv/smil:transtv.smil/playlist.m3u8"
            },
            {

                "url": "https://ott-balancer.tvri.go.id/live/eds/Nasional/hls/Nasional.m3u8"

            {

                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2kPbkIp9idNFIcbHt1lxXr6FKQQUpRzrisw&usqp=CAU",
                "url": "https://op-flashcon-digdayahd-1.dens.tv/h/h12/index.m3u8"
            },
            {
                "name": "Kompas TV",
                "category": "TV Indonesia",
                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7HPAmO80jmnzCTqJEKnOzcEweDOepORaxAQ&usqp=CAU",
                "url": "https://op-flashcon-digdayahd-1.dens.tv/h/h234/index.m3u8"
            },
            {
                "name": "CNN Indonesia",
                "category": "TV Indonesia",
                "logo": "https://cdn.cnnindonesia.com/cnnid/images/Logo-CNN-Indonesia-Peta-Indonesia.jpg?v=8.3.1",

            },
            {

                "category": "TV Indonesia",
                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQg8NEXmKs66ZU_GTi5-lbr2iA6E6GnAvJbHESGliuHzywh4A9kJhOtWoWu&s=10",
                "url": "https://live.cnbcindonesia.com/livecnbc/smil:cnbctv.smil/playlist.m3u8"
            },

            // Kategori: TV Sports
            {
                "name": "TVRI SPORT",
                "category": "TV SPORT",
                "logo": "https://football-tribe.com/indonesia/wp-content/uploads/sites/10/2019/01/TVRI-Sport-HD.png",

            },
            {

                "category": "TV SPORT",
                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbSr9_uPrD4rwhoCLKTFcsbcpe79xIQrIwWt4Xo6ehbFs3c9-a9f0r5FAV&s=10",
                "url": "https://dms.redbull.tv/v5/destination/rbtv/linear-borb/personal_computer/http/us/en/playlist.m3u8"
            },
            {

                "category": "TV SPORT",
                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSNxBCXUOMNAi9BbQDpxxyazAD7YsW0n7lg-3KH6Lhh4a0AC8rGBxwwG5G-&s=10",
                "url": "https://rmtv.akamaized.net/hls/live/2043154/rmtv-en-web/master.m3u8"
            },
            {

            // Kategori: TV Movies & Entertainment
            {

                "category": "TV Movies",
                "logo": "https://thumbor.prod.vidiocdn.com/1bHJE8jzAfdHr_zMSs216Ya-pGk=/filters:quality(70)/vidio-web-prod-livestreaming/uploads/livestreaming/image/8121/rock-action-3cc936.jpg",
                "url": "https://d84q7nw4qf3j3.cloudfront.net/out/v1/010bb28c19b64975b318d3b00f58b18b/index.mpd|drmScheme=clearkey&drmLicense=d4126f7fd6134adfbedb3a0daefd7657:920f1adcca60069c887da7f1d225607d"
            },
            {
                "name": "Movie Sphere",
                "category": "TV Movies",
                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-_Y4gs8EO8rIRq54qmUgAEpByiP9m1_yiDI2XEa_PvHzTztocFOiqtGfP&s=10",
                "url": "https://moviesphereuk-samsunguk.amagi.tv/playlist.m3u8"
            },

            // Kategori: TV Kids & Others
            {
                "name": "ABC Kids",
                "category": "TV Kids",
                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlH6Kop5MWJ8q9eVLud8PTVMkE-IXMCF7G_Q&usqp=CAU",
                "url": "https://c.mjh.nz/abc-kids.m3u8"
            },
            {
                "name": "Discovery Asia",
                "category": "TV Others",
                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgLiwkOnQ9cZzUXfpkRAJj7WGbZCFMAwxXvA&usqp=CAU",
                "url": "https://cdn4.skygo.mn/live/disk1/Discovery_Asia/HLSv3-FTA/Discovery_Asia.m3u8"
            }
        ];

        const videoEl = document.getElementById('videoPlayer');
        const statusEl = document.getElementById('status');
        let player;

        // 2. INISIALISASI SHAKA PLAYER
        function initApp() {
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                player = new shaka.Player(videoEl);
                player.addEventListener('error', onErrorEvent);
                renderChannelList();
            } else {
                alert('Browser tidak mendukung Shaka Player.');
            }
        }

        function onErrorEvent(event) {
            const error = event.detail;
            console.error('Shaka Error:', error.code, error);
            
            let errMsg = "Terjadi gangguan saat memuat stream.";
            if (error.code === 1002 || error.code === 1001) errMsg = "Link offline atau diblokir CORS.";
            if (error.code === 6012 || error.code === 6007) errMsg = "Lisensi DRM tidak valid atau kedaluwarsa.";
            
            statusEl.innerHTML = `❌ Error [${error.code}]: ${errMsg}`;
            statusEl.className = 'error-text';
        }

        // 3. RENDER DAFTAR CHANNEL
        function renderChannelList() {
            const listDiv = document.getElementById('channel-list');
            
            const categories = {};
            STREAM_URLS.forEach(ch => {
                if (!categories[ch.category]) categories[ch.category] = [];
                categories[ch.category].push(ch);
            });

            for (const [catName, channels] of Object.entries(categories)) {
                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = catName;
                listDiv.appendChild(title);

                channels.forEach(channel => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.innerHTML = `
                        <img class="channel-logo" src="${channel.logo}" alt="logo">
                        <div class="channel-info">
                            <span class="channel-name">${channel.name}</span>
                        </div>
                    `;
                    card.onclick = () => playStream(channel.name, channel.url);
                    listDiv.appendChild(card);
                });
            }
        }

        // 4. PEMUTAR STREAM
        async function playStream(channelName, rawData) {
            statusEl.className = '';
            statusEl.innerHTML = `⏳ Sedang memuat <b>${channelName}</b>...`;
            
            try {
                const [streamUrl, paramsStr] = rawData.split('|');
                const params = new URLSearchParams(paramsStr || '');
                const drmScheme = params.get('drmScheme');
                const drmLicense = params.get('drmLicense');

                const shakaConfig = { drm: { clearKeys: {}, servers: {} } };

                if (drmScheme === 'clearkey' && drmLicense) {
                    const keys = {};
                    drmLicense.split(',').forEach(pair => {
                        const [kid, key] = pair.split(':');
                        if (kid && key) keys[kid] = key;
                    });
                    shakaConfig.drm.clearKeys = keys;
                } else if (drmScheme === 'widevine' && drmLicense) {
                    shakaConfig.drm.servers = { 'com.widevine.alpha': drmLicense };
                }

                player.configure(shakaConfig);
                await player.load(streamUrl);
                
                statusEl.innerHTML = `✅ Sedang menonton: <b>${channelName}</b>`;
            } catch (error) {
                console.error('Gagal memuat stream:', error);
                statusEl.innerHTML = `❌ Gagal memutar <b>${channelName}</b>.`;
                statusEl.className = 'error-text';
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

    <!-- Library Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 320px; background: #1e1e1e; overflow-y: auto; border-right: 1px solid #333; padding: 15px; box-sizing: border-box; }
        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .main { flex-grow: 1; display: flex; flex-direction: column; }
        .video-container { flex-grow: 1; background: #000; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; outline: none; }
        h2 { text-align: center; border-bottom: 2px solid #e50914; padding-bottom: 10px; margin-top: 0; font-size: 24px; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Grup Kategori */
        .category-title { margin: 20px 0 10px 0; font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        /* Kartu Channel */
        .channel-card { display: flex; align-items: center; padding: 10px; background: #2a2a2a; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .channel-card:hover { background: #333; border-color: #e50914; transform: translateX(5px); }
        .channel-logo { width: 60px; height: 40px; object-fit: contain; background: #fff; border-radius: 4px; margin-right: 12px; padding: 2px; }
        .channel-info { display: flex; flex-direction: column; }
        .channel-name { font-weight: bold; font-size: 14px; color: #fff; }
        
        #status { padding: 15px; background: #1a1a1a; text-align: center; font-weight: bold; border-top: 1px solid #333; color: #00ff88; font-size: 16px; }
        .error-text { color: #ff3333 !important; }
    </style>
</head>
<body>

    <!-- DAFTAR CHANNEL (SIDEBAR) -->
    <div class="sidebar">
        <h2>📺 DIMAS TV</h2>
        <div id="channel-list"></div>
    </div>

    <!-- PEMUTAR VIDEO (MAIN) -->

        <div class="video-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>
        <div id="status">Pilih channel di samping untuk mulai menonton...</div>
    </div>

            {

                "url": "http://d84q7nw4qf3j3.cloudfront.net/out/v1/ab3ef0f0e4144c3c8b7e60f1873a3bcc/index.mpd|drmScheme=clearkey&drmLicense=6f309276a94e45be89a8860159456e84:3fe2eec12885264556ca4e29aa6c0c40"
            },
            {
                "name": "Discovery Channel",
                "category": "TV Others",
                "logo": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgLiwkOnQ9cZzUXfpkRAJj7WGbZCFMAwxXvA&usqp=CAU",
                "url": "https://qp-pldt-live-bpk-01-prod.akamaized.net/bpk-tv/discovery/default/index.mpd|drmScheme=clearkey&drmLicense=d5a7f8219c364e50b2147f6d3a8c9025:c77d5e56c52c4065c42594422ac85e2c"
            }
        ];

        const videoEl = document.getElementById('videoPlayer');
        const statusEl = document.getElementById('status');
        let player;

        // 2. INISIALISASI SHAKA PLAYER
        function initApp() {
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                player = new shaka.Player(videoEl);
                player.addEventListener('error', onErrorEvent);
                renderChannelList();
            } else {
                alert('Browser ini tidak mendukung Shaka Player!');
            }
        }

        // Tampilan Error Console
        function onErrorEvent(event) {
            const error = event.detail;
            console.error('Shaka Error:', error.code, error);
            
            let errMsg = "Terjadi Kesalahan Sistem.";
            if (error.code === 1002 || error.code === 1001) errMsg = "Link mati atau diblokir CORS.";
            if (error.code === 6012 || error.code === 6007) errMsg = "Gagal mengambil lisensi DRM (Server Key Mati).";
            
            statusEl.innerHTML = `❌ Error [${error.code}]: ${errMsg}`;
            statusEl.className = 'error-text';
        }

        // 3. RENDER MENU SIDEBAR (Dikelompokkan berdasarkan Kategori)
        function renderChannelList() {
            const listDiv = document.getElementById('channel-list');
            
            // Mengelompokkan channel berdasarkan kategori
            const categories = {};
            STREAM_URLS.forEach(ch => {
                if (!categories[ch.category]) categories[ch.category] = [];
                categories[ch.category].push(ch);
            });

            for (const [catName, channels] of Object.entries(categories)) {
                // Buat Judul Kategori
                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = catName;
                listDiv.appendChild(title);

                // Buat Tombol Channel
                channels.forEach(channel => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.innerHTML = `
                        <img class="channel-logo" src="${channel.logo}" alt="logo">
                        <div class="channel-info">
                            <span class="channel-name">${channel.name}</span>
                        </div>
                    `;
                    card.onclick = () => playStream(channel.name, channel.url);
                    listDiv.appendChild(card);
                });
            }
        }

        // 4. MESIN PEMUTAR & EKSTRAKTOR DRM
        async function playStream(channelName, rawData) {
            statusEl.className = '';
            statusEl.innerHTML = `⏳ Sedang memuat <b>${channelName}</b>...`;
            
            try {
                // Memecah format "URL_ASLI|PARAMETER"
                const [streamUrl, paramsStr] = rawData.split('|');
                const params = new URLSearchParams(paramsStr || '');
                const drmScheme = params.get('drmScheme');
                const drmLicense = params.get('drmLicense');

                // Reset konfigurasi sebelumnya
                const shakaConfig = { drm: { clearKeys: {}, servers: {} } };

                // Deteksi dan Atur Sistem Keamanan (ClearKey/Widevine)
                if (drmScheme === 'clearkey' && drmLicense) {
                    const keys = {};
                    drmLicense.split(',').forEach(pair => {
                        const [kid, key] = pair.split(':');
                        if (kid && key) keys[kid] = key;
                    });
                    shakaConfig.drm.clearKeys = keys;
                    console.log(`[DRM] ClearKey diterapkan untuk ${channelName}`);
                } 
                else if (drmScheme === 'widevine' && drmLicense) {
                    shakaConfig.drm.servers = { 'com.widevine.alpha': drmLicense };
                    console.log(`[DRM] Widevine diterapkan untuk ${channelName}`);
                }

                // Terapkan konfigurasi ke player
                player.configure(shakaConfig);
                
                // Mulai memutar URL
                await player.load(streamUrl);
                
                statusEl.innerHTML = `✅ Sedang menonton: <b>${channelName}</b>`;
            } catch (error) {
                console.error('Gagal memuat stream:', error);
                statusEl.innerHTML = `❌ Gagal memutar <b>${channelName}</b>. Link mungkin rusak/expired.`;
                statusEl.className = 'error-text';
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas TV - Auto Load Database</title>
    <!-- Library Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    
    <!-- MEMANGGIL FILE DATABASE ASLIMU -->
    <script src="b_script (SFILE.MOBI).js"></script>

    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: white; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 350px; background: #1a1a1a; overflow-y: auto; border-right: 1px solid #2a2a2a; padding: 15px; box-sizing: border-box; }
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: #e50914; border-radius: 4px; }
        h2 { text-align: center; border-bottom: 2px solid #e50914; padding-bottom: 10px; margin-top: 0; font-size: 24px; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
        .category-title { margin: 25px 0 10px 0; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 5px; font-weight: bold; }
        .channel-card { display: flex; align-items: center; padding: 10px; background: #242424; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent; }
        .channel-card:hover { background: #333; border-color: #e50914; transform: translateX(5px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .channel-card.active { background: #e50914; border-color: #ff3333; }
        .channel-logo { width: 60px; height: 40px; object-fit: contain; background: #fff; border-radius: 4px; margin-right: 12px; padding: 2px; }
        .channel-info { overflow: hidden; }
        .channel-name { font-weight: 600; font-size: 13px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .channel-server { font-size: 10px; color: #aaa; margin-top: 3px; display: block; }
        .main { flex-grow: 1; display: flex; flex-direction: column; background: #000; }
        .video-container { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; outline: none; }
        #status { padding: 15px; background: #151515; text-align: center; font-weight: bold; border-top: 1px solid #2a2a2a; color: #00ff88; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .error-text { color: #ff3333 !important; }
        .proxy-text { color: #ffb700 !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>📺 DIMAS TV</h2>
        <div id="channel-list"></div>
    </div>

    <div class="main">
        <div class="video-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>
        <div id="status">Menginisialisasi Sistem...</div>
    </div>

    <script>
        const videoEl = document.getElementById('videoPlayer');
        const statusEl = document.getElementById('status');
        let player;
        let currentActiveCard = null;

        function initApp() {
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                player = new shaka.Player(videoEl);
                player.configure({
                    streaming: { retryParameters: { maxAttempts: 3, baseDelay: 1000 } }
                });
                player.addEventListener('error', onErrorEvent);
                
                // Mulai memproses data dari file b_script aslimu
                parseAndRenderDatabase();
            } else {
                alert('Browser tidak mendukung Shaka Player.');
            }
        }

        function onErrorEvent(event) {
            const error = event.detail;
            console.error('Shaka Error:', error.code, error);
            statusEl.innerHTML = `❌ Error [${error.code}]: Stream terputus / diblokir / DRM Error.`;
            statusEl.className = 'error-text';
        }

        function parseAndRenderDatabase() {
            // Mengecek apakah file b_script berhasil dipanggil
            if (typeof STREAM_URLS === 'undefined') {
                statusEl.innerHTML = `❌ Error: File "b_script (SFILE.MOBI).js" tidak ditemukan!`;
                statusEl.className = 'error-text';
                return;
            }

            let processedChannels = [];

            // 1. Ekstrak Channel TV Biasa
            if(STREAM_URLS.channels) {
                STREAM_URLS.channels.forEach(ch => {
                    if (ch.servers && ch.servers.length > 0) {
                        processedChannels.push({
                            name: ch.name,
                            category: ch.category || "Uncategorized",
                            logo: ch.logo || "https://cdn-icons-png.flaticon.com/512/716/716429.png",
                            serverName: ch.servers[0].name,
                            url: ch.servers[0].url // Otomatis ambil server pertama
                        });
                    }
                });
            }

            // 2. Ekstrak Jadwal Pertandingan
            if(STREAM_URLS.events) {
                STREAM_URLS.events.forEach(ev => {
                    if (ev.servers && ev.servers.length > 0) {
                        processedChannels.push({
                            name: ev.match,
                            category: "⚽ JADWAL LIVE: " + (ev.league || "Pertandingan"),
                            logo: "https://cdn-icons-png.flaticon.com/512/1165/1165183.png",
                            serverName: ev.servers[0].name,
                            url: ev.servers[0].url
                        });
                    }
                });
            }

            if(processedChannels.length > 0) {
                renderToScreen(processedChannels);
                statusEl.innerHTML = `✅ Sukses memuat ${processedChannels.length} stream dari file b_script!`;
            } else {
                statusEl.innerHTML = `⚠️ File terbaca, tapi tidak ada channel di dalamnya.`;
            }
        }

        function renderToScreen(dataList) {
            const listDiv = document.getElementById('channel-list');
            listDiv.innerHTML = '';
            
            const categories = {};
            dataList.forEach(item => {
                if (!categories[item.category]) categories[item.category] = [];
                categories[item.category].push(item);
            });

            for (const [catName, items] of Object.entries(categories)) {
                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = catName;
                listDiv.appendChild(title);

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.innerHTML = `
                        <img class="channel-logo" src="${item.logo}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
                        <div class="channel-info">
                            <span class="channel-name">${item.name}</span>
                            <span class="channel-server">[${item.serverName}]</span>
                        </div>
                    `;
                    
                    card.onclick = () => {
                        if (currentActiveCard) currentActiveCard.classList.remove('active');
                        card.classList.add('active');
                        currentActiveCard = card;
                        playStream(item.name, item.url);
                    };
                    listDiv.appendChild(card);
                });
            }
        }

        async function playStream(channelName, rawData) {
            statusEl.className = '';
            statusEl.innerHTML = `⏳ Menghubungkan ke <b>${channelName}</b>...`;
            
            try {
                const [streamUrl, paramsStr] = rawData.split('|');
                const params = new URLSearchParams(paramsStr || '');
                const drmScheme = params.get('drmScheme');
                const drmLicense = params.get('drmLicense');
                
                const reqUa = params.get('User-Agent') || params.get('user-agent') || '';
                const reqRef = params.get('Referer') || params.get('referer') || '';
                const needsProxy = reqUa !== '' || reqRef !== '';

                const shakaConfig = { drm: { clearKeys: {}, servers: {} } };

                if (drmScheme === 'clearkey' && drmLicense) {
                    const keys = {};
                    drmLicense.split(',').forEach(pair => {
                        const [kid, key] = pair.split(':');
                        if (kid && key) keys[kid] = key;
                    });
                    shakaConfig.drm.clearKeys = keys;
                } else if (drmScheme === 'widevine' && drmLicense) {
                    shakaConfig.drm.servers = { 'com.widevine.alpha': drmLicense };
                }

                player.configure(shakaConfig);

                // === MESIN PROXY ZYNFX ===
                player.getNetworkingEngine().clearAllRequestFilters();
                
                if (needsProxy) {
                    statusEl.innerHTML = `🕵️‍♂️ Memanggil Agen Zynfx untuk <b>${channelName}</b>...`;
                    statusEl.className = 'proxy-text';
                    
                    player.getNetworkingEngine().registerRequestFilter((type, request) => {
                        // Jangan gunakan proxy untuk License DRM
                        if (type == shaka.net.NetworkingEngine.RequestType.LICENSE) return;

                        const originalUri = request.uris[0];
                        let proxyUrl = `https://zynfx.eu.org/api/proxy?url=${encodeURIComponent(originalUri)}`;
                        if (reqUa) proxyUrl += `&ua=${encodeURIComponent(reqUa)}`;
                        if (reqRef) proxyUrl += `&referer=${encodeURIComponent(reqRef)}`;

                        request.uris[0] = proxyUrl;
                    });
                }
                // =========================

                await player.load(streamUrl);
                
                if (needsProxy) {
                    statusEl.innerHTML = `✅ Zynfx sukses menyiarkan: <b>${channelName}</b>`;
                    statusEl.className = 'proxy-text';
                } else {
                    statusEl.innerHTML = `✅ Sedang menonton: <b>${channelName}</b>`;
                    statusEl.className = '';
                }
                
            } catch (error) {
                console.error('Gagal memuat stream:', error);
                statusEl.innerHTML = `❌ Gagal memutar <b>${channelName}</b>.`;
                statusEl.className = 'error-text';
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
